<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merdiven Lab — 4 stil</title>
<style>
  html,body{margin:0;height:100%;background:#eef1f4;font-family:system-ui,sans-serif;overflow:hidden}
  #c{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:10px;left:10px;background:rgba(255,255,255,.92);border:1px solid #ccd;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;box-shadow:0 2px 10px rgba(0,0,0,.08);max-width:300px}
  #hud b{color:#2D6A4F}
  #hud .row{margin-top:6px}
  #hud button{font:inherit;padding:4px 8px;margin:2px 2px 0 0;border:1px solid #ccd;border-radius:6px;background:#fff;cursor:pointer}
  #hud button.on{background:#2D6A4F;color:#fff;border-color:#2D6A4F}
  .lbl{position:fixed;transform:translate(-50%,-50%);font-weight:700;font-size:12px;color:#333;pointer-events:none;text-shadow:0 1px 2px #fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b>Merdiven Lab</b> — 4 stil yan yana</div>
  <div style="color:#666">Sürükle: döndür · Tekerlek: yakınlaş · Sağ tık sürükle: kaydır</div>
  <div class="row">
    <button id="bSlab" class="on">Üst kat döşemesi</button>
    <button id="bWalls" class="on">Kovan duvarları</button>
    <button id="bFoot" class="on">Ayak izi</button>
  </div>
  <div class="row" style="color:#666;font-size:12px" id="info"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ── Shared parameters (match the real app) ──────────────────────────────
const RISE_TARGET = 3.22;          // F1 + SLAB2 (one storey)
const STEP_TREAD  = 0.28;
const STEP_W      = 1.0;           // flight width
const TREAD_THICK = 0.06;
const N = Math.max(4, Math.round(RISE_TARGET / 0.175));
const STEP_RISE = RISE_TARGET / N; // exact rise per step

// ── Scene ───────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f4);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 9, 16);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8090a0, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(8, 16, 10); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=-20; sun.shadow.camera.right=20; sun.shadow.camera.top=20; sun.shadow.camera.bottom=-20;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80,40), new THREE.MeshStandardMaterial({color:0xdfe4e8}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(80, 80, 0xc2c9cf, 0xd6dbe0); grid.position.y=0.001; scene.add(grid);

const matStep   = new THREE.MeshStandardMaterial({color:0xcfcabf, roughness:0.85});
const matLand   = new THREE.MeshStandardMaterial({color:0xc4bfb4, roughness:0.85});
const matPole   = new THREE.MeshStandardMaterial({color:0x9a958c, roughness:0.7, metalness:0.2});
const matSlab   = new THREE.MeshStandardMaterial({color:0xbfc6cc, transparent:true, opacity:0.35, side:THREE.DoubleSide});
const matWall   = new THREE.MeshStandardMaterial({color:0xe6e2da, roughness:0.9, transparent:true, opacity:0.55, side:THREE.DoubleSide});

const slabs=[], walls=[], foots=[];
function tread(w,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(d,TREAD_THICK,w), mat||matStep); m.castShadow=true; m.receiveShadow=true; return m; }

// ── Stair builders. Each returns {group, foot:[ [x,z]... ] bounding footprint, label } ──
// 1) Single straight flight
function buildStraight(){
  const g=new THREE.Group();
  for(let i=0;i<N;i++){ const t=tread(STEP_W, STEP_TREAD); t.position.set((i+0.5)*STEP_TREAD, (i+1)*STEP_RISE - TREAD_THICK/2, 0); g.add(t); }
  const L=N*STEP_TREAD;
  return {group:g, foot:rect(0,-STEP_W/2, L, STEP_W/2), info:`Düz: ${N} basamak · ayak izi ${L.toFixed(1)}×${STEP_W.toFixed(1)} m`};
}
// 2) U-switchback with a GENEROUS mid-landing
function buildU(landingExtra){
  const g=new THREE.Group();
  const f1=Math.ceil(N/2), f2=N-f1;
  const landingDepth = STEP_TREAD + (landingExtra||1.0);
  const run1=f1*STEP_TREAD;
  for(let i=0;i<f1;i++){ const t=tread(STEP_W,STEP_TREAD); t.position.set((i+0.5)*STEP_TREAD,(i+1)*STEP_RISE-TREAD_THICK/2, 0); g.add(t); }
  const landY=f1*STEP_RISE;
  const land=new THREE.Mesh(new THREE.BoxGeometry(landingDepth,TREAD_THICK,2*STEP_W), matLand);
  land.position.set(run1+landingDepth/2, landY-TREAD_THICK/2, STEP_W/2); land.castShadow=true; land.receiveShadow=true; g.add(land);
  // Upper flight runs back in -X over the SAME x-span as the lower flight (aligned), offset by one
  // width in +Z. The landing sits beyond, at the +X turn. (Was: startX=run1+landingDepth → shifted.)
  const startX=run1;
  for(let i=0;i<f2;i++){ const t=tread(STEP_W,STEP_TREAD); t.position.set(startX-(i+0.5)*STEP_TREAD, landY+(i+1)*STEP_RISE-TREAD_THICK/2, STEP_W); g.add(t); }
  const totalDir=run1+landingDepth;
  return {group:g, foot:rect(0,-STEP_W/2, totalDir, 1.5*STEP_W), info:`U + geniş sahanlık: ${N} basamak · ${totalDir.toFixed(1)}×${(2*STEP_W).toFixed(1)} m`};
}
// 3) L-shape (quarter turn): up +X, landing, then up +Z
function buildL(){
  const g=new THREE.Group();
  const f1=Math.ceil(N/2), f2=N-f1, run1=f1*STEP_TREAD;
  for(let i=0;i<f1;i++){ const t=tread(STEP_W,STEP_TREAD); t.position.set((i+0.5)*STEP_TREAD,(i+1)*STEP_RISE-TREAD_THICK/2, 0); g.add(t); }
  const landY=f1*STEP_RISE;
  const land=new THREE.Mesh(new THREE.BoxGeometry(STEP_W,TREAD_THICK,STEP_W), matLand);
  land.position.set(run1+STEP_W/2, landY-TREAD_THICK/2, 0); land.castShadow=true; land.receiveShadow=true; g.add(land);
  const cx=run1+STEP_W/2;
  for(let i=0;i<f2;i++){ const t=tread(STEP_W,STEP_TREAD,matStep); t.geometry=new THREE.BoxGeometry(STEP_W,TREAD_THICK,STEP_TREAD);
    t.position.set(cx, landY+(i+1)*STEP_RISE-TREAD_THICK/2, STEP_W/2+(i+0.5)*STEP_TREAD); t.castShadow=true; t.receiveShadow=true; g.add(t); }
  // Actual L-shaped footprint (6 verts) so the walls/hole hug the L, leaving the inner corner open.
  const h=STEP_W/2, ax1=run1+STEP_W, bz1=STEP_W/2+f2*STEP_TREAD;
  const foot=[[0,-h],[ax1,-h],[ax1,bz1],[run1,bz1],[run1,h],[0,h]];
  return {group:g, foot:foot, info:`L (çeyrek dönüş): ${N} basamak · L kolları ${ax1.toFixed(1)}×${(bz1+h).toFixed(1)} m`};
}
// 4) Spiral around a central pole
function buildSpiral(){
  const g=new THREE.Group();
  const innerR=0.18, outerR=1.30, midR=(innerR+outerR)/2;
  const totalAngle = 2.6*Math.PI;            // ~470°
  const aStep = totalAngle/N;
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(innerR,innerR,RISE_TARGET+0.2,20), matPole);
  pole.position.set(0,(RISE_TARGET)/2,0); pole.castShadow=true; g.add(pole);
  for(let i=0;i<N;i++){ const th=i*aStep;
    const t=new THREE.Mesh(new THREE.BoxGeometry(outerR-innerR, TREAD_THICK, 0.42), matStep);
    t.position.set(Math.cos(th)*midR, (i+1)*STEP_RISE - TREAD_THICK/2, Math.sin(th)*midR);
    t.rotation.y = -th; t.castShadow=true; t.receiveShadow=true; g.add(t);
  }
  return {group:g, foot:circle(0,0,outerR+0.05,28), info:`Sarmal: ${N} basamak · çap ${(2*(outerR+0.05)).toFixed(1)} m`};
}
function rect(x0,z0,x1,z1){ return [[x0,z0],[x1,z0],[x1,z1],[x0,z1]]; }
function circle(cx,cz,r,seg){ const p=[]; for(let i=0;i<seg;i++){const a=i/seg*Math.PI*2; p.push([cx+Math.cos(a)*r, cz+Math.sin(a)*r]);} return p; }

// ── Layout: place the four side by side, footprint-centred ───────────────
const defs=[
  {name:'1 · Düz tek kol',  build:buildStraight},
  {name:'2 · U + sahanlık', build:()=>buildU(1.0)},
  {name:'3 · L (çeyrek)',   build:buildL},
  {name:'4 · Sarmal',       build:buildSpiral},
];
const CELL=8; const labels=[];
defs.forEach((d,idx)=>{
  const res=d.build();
  // recentre group so its footprint bbox centre sits at the cell origin
  const bb=bbox(res.foot); const cx=(bb.x0+bb.x1)/2, cz=(bb.z0+bb.z1)/2;
  res.group.position.x=-cx; res.group.position.z=-cz;
  const cell=new THREE.Group(); cell.position.x=(idx-(defs.length-1)/2)*CELL;
  cell.add(res.group);
  // footprint outline (the F1-fit hole) on the ground
  const fp=res.foot.map(p=>[p[0]-cx,p[1]-cz]);
  cell.add(footprintLine(fp));
  // translucent next-floor slab with the hole cut
  cell.add(holeSlab(fp));
  // shaft walls around the footprint (rough enclosure preview)
  cell.add(shaftWalls(fp));
  scene.add(cell);
  d._res=res; d._cell=cell;
  // HTML label
  const el=document.createElement('div'); el.className='lbl'; el.textContent=d.name; document.body.appendChild(el);
  labels.push({el, cell, name:d.name});
});
document.getElementById('info').innerHTML = defs.map(d=>d._res.info).join('<br>');

function bbox(poly){ let x0=1e9,z0=1e9,x1=-1e9,z1=-1e9; poly.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);z0=Math.min(z0,p[1]);z1=Math.max(z1,p[1]);}); return {x0,z0,x1,z1}; }
function footprintLine(poly){
  const pts=poly.map(p=>new THREE.Vector3(p[0],0.02,p[1])); pts.push(pts[0].clone());
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0x2D6A4F}));
  l.userData.foot=true; foots.push(l); return l;
}
function holeSlab(poly){
  const bb=bbox(poly), m=1.4;
  const sh=new THREE.Shape();
  sh.moveTo(bb.x0-m,bb.z0-m); sh.lineTo(bb.x1+m,bb.z0-m); sh.lineTo(bb.x1+m,bb.z1+m); sh.lineTo(bb.x0-m,bb.z1+m); sh.closePath();
  const hole=new THREE.Path(); hole.moveTo(poly[0][0],poly[0][1]); for(let i=1;i<poly.length;i++)hole.lineTo(poly[i][0],poly[i][1]); hole.closePath(); sh.holes.push(hole);
  const geo=new THREE.ShapeGeometry(sh); geo.rotateX(-Math.PI/2); geo.translate(0,RISE_TARGET,0);
  const mesh=new THREE.Mesh(geo, matSlab); mesh.userData.slab=true; slabs.push(mesh); return mesh;
}
function shaftWalls(poly){
  const g=new THREE.Group(); g.userData.wall=true; walls.push(g);
  for(let i=0;i<poly.length;i++){ const a=poly[i], b=poly[(i+1)%poly.length];
    const dx=b[0]-a[0], dz=b[1]-a[1], len=Math.hypot(dx,dz); if(len<0.3) continue;
    // skip ONE side (entry) on the longest edge — just a preview
    const w=new THREE.Mesh(new THREE.BoxGeometry(len,RISE_TARGET,0.1), matWall);
    w.position.set((a[0]+b[0])/2, RISE_TARGET/2, (a[1]+b[1])/2);
    w.rotation.y=-Math.atan2(dz,dx); g.add(w);
  }
  return g;
}

// ── HUD toggles ──────────────────────────────────────────────────────────
function toggle(arr,on){ arr.forEach(o=>o.visible=on); }
const bSlab=document.getElementById('bSlab'), bWalls=document.getElementById('bWalls'), bFoot=document.getElementById('bFoot');
bSlab.onclick=()=>{bSlab.classList.toggle('on'); toggle(slabs,bSlab.classList.contains('on'));};
bWalls.onclick=()=>{bWalls.classList.toggle('on'); toggle(walls,bWalls.classList.contains('on'));};
bFoot.onclick=()=>{bFoot.classList.toggle('on'); toggle(foots,bFoot.classList.contains('on'));};

// ── Render loop + label projection ───────────────────────────────────────
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
renderer.setSize(innerWidth,innerHeight);
const v=new THREE.Vector3();
function tick(){
  controls.update();
  labels.forEach(L=>{ v.set(L.cell.position.x, RISE_TARGET+1.3, L.cell.position.z); v.project(camera);
    L.el.style.left=(v.x*0.5+0.5)*innerWidth+'px'; L.el.style.top=(-v.y*0.5+0.5)*innerHeight+'px';
    L.el.style.display = (v.z<1)?'block':'none';
  });
  renderer.render(scene,camera); requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
