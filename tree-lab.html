<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tree Lab — realistic trees, plants, evergreens & hedges</title>
<style>
  html,body{margin:0;height:100%;background:#9ec5e8;font-family:system-ui,sans-serif;overflow:hidden}
  #c{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:10px;left:10px;background:rgba(255,255,255,.93);border:1px solid #ccd;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;box-shadow:0 2px 12px rgba(0,0,0,.12);max-width:260px}
  #hud b{color:#2D6A4F}
  #hud .row{margin-top:8px}
  #hud button{font:inherit;padding:5px 10px;margin:3px 3px 0 0;border:1px solid #ccd;border-radius:7px;background:#fff;cursor:pointer}
  #hud button.on{background:#2D6A4F;color:#fff;border-color:#2D6A4F}
  #hud .hint{color:#888;font-size:11px}
  .lbl{position:fixed;transform:translate(-50%,-50%);font-weight:700;font-size:12px;color:#234;pointer-events:none;text-shadow:0 1px 3px #fff,0 0 4px #fff;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err" style="display:none;position:fixed;left:10px;bottom:10px;max-width:60vw;background:#2b0000;color:#ffb4b4;font:12px/1.5 monospace;padding:10px 12px;border:1px solid #803030;border-radius:8px;white-space:pre-wrap;z-index:99"></div>
<script>
function showErr(msg){var e=document.getElementById('err');e.style.display='block';e.textContent+=msg+'\n';}
window.addEventListener('error',ev=>showErr('JS error: '+ev.message+(ev.filename?(' @ '+ev.filename.split('/').pop()+':'+ev.lineno):'')));
var _ce=console.error.bind(console);console.error=function(){showErr('console.error: '+Array.from(arguments).join(' ').slice(0,800));_ce.apply(null,arguments);};
</script>
<div id="hud">
  <div><b>🌳 Tree Lab</b></div>
  <div class="hint">Drag: orbit · Wheel: zoom · Right-drag: pan</div>
  <div class="row">
    <button id="bRegen">↻ Regenerate</button>
  </div>
  <div class="row">
    <button id="bWind" class="on">Wind</button>
    <button id="bShadow" class="on">Shadows</button>
  </div>
  <div class="row hint">4 specimens: tree · evergreen · plant · hedge</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ════════════════════════════════════════════════════════════════════
// TREE LAB
// Procedural foliage built from layered, vertex-shaded blobs instead of
// single primitives. Each specimen:
//   • bark trunk (tapered) + branches where relevant
//   • foliage = many jittered icosphere/cone "leaf clusters" with a
//     top→bottom color gradient (sun-lit crown, shaded underside)
//   • per-cluster size/hue variation so no two look alike
//   • gentle wind sway pivoting at the canopy base (CPU, WebKit-safe)
// Types: deciduous tree · evergreen (pine/fir) · flowering plant · hedge.
// ════════════════════════════════════════════════════════════════════
if (typeof THREE === 'undefined') { showErr('THREE failed to load — CDN blocked or offline?'); throw new Error('no THREE'); }
if (typeof THREE.OrbitControls === 'undefined') { showErr('OrbitControls failed to load from CDN.'); }
function $(id){ return document.getElementById(id); }

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec5e8);
scene.fog = new THREE.Fog(0x9ec5e8, 30, 80);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 5.5, 16);

const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI/2 - 0.02;
controls.minDistance = 3;
controls.maxDistance = 50;

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x4a6b32, 0.75));
const sun = new THREE.DirectionalLight(0xfff3da, 1.15);
sun.position.set(10, 16, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera; sc.left=-18; sc.right=18; sc.top=18; sc.bottom=-18; sc.near=1; sc.far=70;
sun.shadow.bias = -0.0006;
scene.add(sun);

// ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120,120),
  new THREE.MeshStandardMaterial({color:0x5d8a3a, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ── Helpers ─────────────────────────────────────────────────────────
function _m(geo, mat, x, y, z, shadow){
  const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z);
  if (shadow){ m.castShadow = true; m.receiveShadow = true; } return m;
}
// Bake a vertical top→bottom color gradient into vertex colors (sun crown / shaded base).
function applyGradient(geo, topHex, botHex){
  geo.computeBoundingBox();
  const bb = geo.boundingBox, minY = bb.min.y, h = Math.max(1e-3, bb.max.y - bb.min.y);
  const pos = geo.attributes.position, colors = new Float32Array(pos.count*3);
  const top = new THREE.Color(topHex), bot = new THREE.Color(botHex), c = new THREE.Color();
  for (let i=0;i<pos.count;i++){
    const t = (pos.getY(i)-minY)/h;
    c.copy(bot).lerp(top, t*t*0.6 + t*0.4);     // bias shading toward the underside
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
}
// One organic foliage cluster: a jittered low-poly icosphere with gradient + hue wobble.
function leafCluster(r, topHex, botHex){
  const geo = new THREE.IcosahedronGeometry(r, 1);
  const pos = geo.attributes.position;
  for (let i=0;i<pos.count;i++){
    const f = 0.78 + Math.random()*0.4;
    pos.setXYZ(i, pos.getX(i)*f, pos.getY(i)*(0.85+Math.random()*0.3), pos.getZ(i)*f);
  }
  geo.computeVertexNormals();
  applyGradient(geo, topHex, botHex);
  const hue = 0.92 + Math.random()*0.16;
  const mat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.9, flatShading:true});
  mat.color.setScalar(hue);                       // subtle per-cluster lightness variation
  return _m(geo, mat, 0,0,0, true);
}

// ── Specimens ───────────────────────────────────────────────────────
const swayers = [];
function registerSway(obj, amp){ swayers.push({obj, amp, phase:Math.random()*6.28, bx:obj.rotation.x, bz:obj.rotation.z}); }

// Deciduous tree: tapered trunk + a few branches + a full rounded crown.
function createTree(){
  const g = new THREE.Group();
  const h = 3.4 + Math.random()*1.4;
  const bark = new THREE.MeshStandardMaterial({color:0x6b4a2f, roughness:0.92});
  const trunkH = h*0.55;
  g.add(_m(new THREE.CylinderGeometry(h*0.045, h*0.10, trunkH, 8), bark, 0, trunkH/2, 0, true));
  // branches angling up into the crown
  const nBr = 3 + (Math.random()*3|0);
  for (let i=0;i<nBr;i++){
    const a = Math.random()*6.28, len = h*0.32;
    const br = _m(new THREE.CylinderGeometry(h*0.018, h*0.04, len, 6), bark, 0, trunkH*0.65 + len*0.35, 0, true);
    br.rotation.z = Math.cos(a)*0.6; br.rotation.x = Math.sin(a)*0.6;
    br.position.x = Math.cos(a)*0.1; br.position.z = Math.sin(a)*0.1;
    g.add(br);
  }
  // crown (sways)
  const crown = new THREE.Group(); crown.position.y = trunkH;
  const top = 0x8bc34a, bot = 0x2f5d1e;
  const n = 8 + (Math.random()*5|0);
  for (let i=0;i<n;i++){
    const ang = Math.random()*6.28, rad = Math.random()*h*0.24, by = Math.random()*h*0.42;
    const r = h*0.20 + Math.random()*h*0.14;
    const b = leafCluster(r, top, bot);
    b.position.set(Math.cos(ang)*rad, h*0.06 + by, Math.sin(ang)*rad);
    crown.add(b);
  }
  g.add(crown); registerSway(crown, 0.045);
  g.userData.labelY = trunkH + h*0.7;
  return g;
}

// Evergreen: thin trunk + stacked drooping cone tiers (fir/pine silhouette).
function createEvergreen(){
  const g = new THREE.Group();
  const h = 5 + Math.random()*2.5;
  const bark = new THREE.MeshStandardMaterial({color:0x5a3d28, roughness:0.92});
  g.add(_m(new THREE.CylinderGeometry(h*0.025, h*0.055, h*0.9, 8), bark, 0, h*0.45, 0, true));
  const crown = new THREE.Group();
  const tiers = 6 + (Math.random()*3|0);
  const top = 0x4f9d3a, bot = 0x123318;
  for (let i=0;i<tiers;i++){
    const t = i/(tiers-1);
    const r = h*0.42*(1 - t*0.82) + 0.12;
    const ch = h*0.26;
    const cone = new THREE.ConeGeometry(r, ch, 9);
    applyGradient(cone, top, bot);
    const m = new THREE.Mesh(cone, new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.82, flatShading:true}));
    m.position.y = h*0.28 + t*h*0.66; m.rotation.y = Math.random()*6.28;
    m.castShadow = true; m.receiveShadow = true;
    crown.add(m);
  }
  g.add(crown); registerSway(crown, 0.014);
  g.userData.labelY = h*1.0;
  return g;
}

// Flowering plant / shrub: low mound of small clusters + scattered blossoms.
function createPlant(){
  const g = new THREE.Group();
  const crown = new THREE.Group();
  const top = 0x9ccc65, bot = 0x33691e;
  const n = 5 + (Math.random()*4|0);
  for (let i=0;i<n;i++){
    const ang = Math.random()*6.28, rad = Math.random()*0.4;
    const r = 0.26 + Math.random()*0.22;
    const b = leafCluster(r, top, bot);
    b.position.set(Math.cos(ang)*rad, 0.24 + Math.random()*0.28, Math.sin(ang)*rad);
    crown.add(b);
  }
  const blossom = [0xff6f91, 0xffd54f, 0xba68c8, 0xff8a65, 0xffffff];
  for (let i=0;i<7;i++){
    const ang = Math.random()*6.28, rad = Math.random()*0.45;
    const col = blossom[Math.random()*blossom.length|0];
    const f = _m(new THREE.SphereGeometry(0.07, 8, 8),
      new THREE.MeshStandardMaterial({color:col, roughness:0.55}),
      Math.cos(ang)*rad, 0.45 + Math.random()*0.3, Math.sin(ang)*rad, true);
    crown.add(f);
  }
  g.add(crown); registerSway(crown, 0.05);
  g.userData.labelY = 1.0;
  return g;
}

// Hedge / fence plant: trimmed rectangular box clad in bushy clusters.
function createHedge(len){
  len = len || 4.5; const hgt = 1.1, dep = 0.9;
  const g = new THREE.Group();
  const top = 0x5aa340, bot = 0x16310f;
  g.add(_m(new THREE.BoxGeometry(len, hgt, dep), new THREE.MeshStandardMaterial({color:0x244a14, roughness:1}), 0, hgt/2, 0, true));
  const crown = new THREE.Group();
  const cols = Math.round(len/0.42);
  for (let i=0;i<cols;i++){
    const x = -len/2 + (i+0.5)*(len/cols);
    for (let j=0;j<2;j++){                                  // top row
      const b = leafCluster(0.3 + Math.random()*0.16, top, bot);
      b.position.set(x + (Math.random()-0.5)*0.25, hgt - 0.05 + Math.random()*0.18, (Math.random()-0.5)*dep*0.5);
      crown.add(b);
    }
    for (const zs of [-1, 1]){                              // front & back faces
      const b = leafCluster(0.27 + Math.random()*0.14, top, bot);
      b.position.set(x, 0.45 + Math.random()*0.5, zs*dep*0.5);
      crown.add(b);
    }
  }
  g.add(crown); registerSway(crown, 0.01);
  g.userData.labelY = hgt + 0.9;
  return g;
}

// ── Place specimens + screen labels ─────────────────────────────────
let specimens = new THREE.Group(); scene.add(specimens);
const SPOTS = [
  {x:-7,  z:0, make:()=>createTree(),      text:'Tree (deciduous)'},
  {x:-2.5,z:0, make:()=>createEvergreen(), text:'Evergreen'},
  {x:3.2, z:0, make:()=>createHedge(4.5),  text:'Hedge (fence plant)'},
  {x:7.3, z:0, make:()=>createPlant(),     text:'Plant'},
];
const labels = SPOTS.map(s => { const el = document.createElement('div'); el.className='lbl'; el.textContent=s.text; document.body.appendChild(el); return el; });
const anchors = [];

function build(){
  scene.remove(specimens);
  specimens.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  swayers.length = 0; anchors.length = 0;
  specimens = new THREE.Group(); scene.add(specimens);
  SPOTS.forEach((s, i) => {
    const o = s.make(); o.position.set(s.x, 0, s.z); specimens.add(o);
    anchors.push(new THREE.Vector3(s.x, o.userData.labelY || 3, s.z));
  });
}
build();

// ── HUD ─────────────────────────────────────────────────────────────
let windOn = true;
$('bRegen').onclick = build;
$('bWind').onclick = function(){ windOn = !windOn; this.classList.toggle('on', windOn); };
$('bShadow').onclick = function(){ renderer.shadowMap.enabled = !renderer.shadowMap.enabled; scene.traverse(o=>{ if(o.material) o.material.needsUpdate = true; }); this.classList.toggle('on', renderer.shadowMap.enabled); };

// ── Render loop ─────────────────────────────────────────────────────
const clock = new THREE.Clock();
const proj = new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (windOn) for (const s of swayers){
    s.obj.rotation.z = s.bz + Math.sin(t*1.3 + s.phase)*s.amp;
    s.obj.rotation.x = s.bx + Math.cos(t*1.0 + s.phase)*s.amp*0.7;
  }
  controls.update();
  renderer.render(scene, camera);
  // update screen labels
  for (let i=0;i<labels.length;i++){
    proj.copy(anchors[i]).project(camera);
    const visible = proj.z < 1;
    labels[i].style.display = visible ? 'block' : 'none';
    if (visible){
      labels[i].style.left = ( (proj.x*0.5+0.5)*innerWidth ) + 'px';
      labels[i].style.top  = ( (-proj.y*0.5+0.5)*innerHeight ) + 'px';
    }
  }
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
