<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar Lab — gerçekçi standart güneş paneli</title>
<style>
  html,body{margin:0;height:100%;background:#a9cdf0;font-family:system-ui,sans-serif;overflow:hidden}
  #c{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:10px;left:10px;background:rgba(255,255,255,.94);border:1px solid #ccd;border-radius:10px;
       padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:0 2px 14px rgba(0,0,0,.14);max-width:270px;max-height:94vh;overflow:auto}
  #hud b{color:#1c4e80}
  #hud .grp{margin-top:10px;border-top:1px solid #eee;padding-top:8px}
  #hud .grp:first-of-type{border-top:none}
  #hud .ttl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
  #hud button{font:inherit;padding:5px 9px;margin:2px 3px 0 0;border:1px solid #ccd;border-radius:7px;background:#fff;cursor:pointer}
  #hud button.on{background:#1c4e80;color:#fff;border-color:#1c4e80}
  #hud label{display:block;margin-top:6px;font-size:12px;color:#445}
  #hud input[type=range]{width:100%}
  #hud .val{color:#1c4e80;font-weight:600}
  #hud .hint{color:#999;font-size:11px;margin-top:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err" style="display:none;position:fixed;left:10px;bottom:10px;max-width:60vw;background:#2b0000;color:#ffb4b4;font:12px/1.5 monospace;padding:10px 12px;border:1px solid #803030;border-radius:8px;white-space:pre-wrap;z-index:99"></div>
<script>
function showErr(msg){var e=document.getElementById('err');e.style.display='block';e.textContent+=msg+'\n';}
window.addEventListener('error',ev=>showErr('JS error: '+ev.message+(ev.filename?(' @ '+ev.filename.split('/').pop()+':'+ev.lineno):'')));
var _ce=console.error.bind(console);console.error=function(){showErr('console.error: '+Array.from(arguments).join(' ').slice(0,800));_ce.apply(null,arguments);};
</script>

<div id="hud">
  <div><b>☀ Solar Lab</b> · standart panel</div>
  <div class="hint">Drag: orbit · Wheel: zoom · Right-drag: pan</div>

  <div class="grp">
    <div class="ttl">Hücre tipi</div>
    <div id="cell"><button data-cell="mono">Monokristal (siyah)</button><button data-cell="poly">Polikristal (mavi)</button></div>
  </div>
  <div class="grp">
    <div class="ttl">Arka tabaka (backsheet)</div>
    <div id="back"><button data-back="black">Siyah (full-black)</button><button data-back="white">Beyaz</button></div>
  </div>
  <div class="grp">
    <div class="ttl">Çerçeve</div>
    <div id="frame"><button data-frame="silver">Gümüş alüminyum</button><button data-frame="black">Siyah anodize</button></div>
  </div>
  <div class="grp">
    <div class="ttl">Modül</div>
    <div id="size"><button data-size="60">60 hücre (6×10)</button><button data-size="72">72 hücre (6×12)</button></div>
    <label>Cam pürüzü (parlaklık): <span class="val" id="vGl">0.10</span>
      <input type="range" id="sGl" min="0.02" max="0.45" step="0.01" value="0.10"></label>
  </div>
  <div class="grp">
    <div class="ttl">Yerleşim</div>
    <div id="arr"><button data-arr="1">Tek modül</button><button data-arr="2x2">2×2</button><button data-arr="3x4">3×4 dizi</button></div>
    <label>Eğim (tilt): <span class="val" id="vTl">18</span>°
      <input type="range" id="sTl" min="0" max="45" step="1" value="18"></label>
    <button id="bMount" class="on">Montaj rayı</button>
  </div>
  <div class="grp">
    <div class="ttl">Sahne</div>
    <label>Güneş açısı: <span class="val" id="vSun">45</span>°
      <input type="range" id="sSun" min="10" max="85" step="1" value="45"></label>
    <button id="bShadow" class="on">Gölgeler</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ════════════════════════════════════════════════════════════════════
// SOLAR LAB — one carefully-made, standard-looking PV module.
// Realism comes from: (1) a procedurally drawn CELL TEXTURE (chamfered mono
// cells / speckled poly cells, silver busbars + fine fingers, backsheet gaps),
// (2) a clearcoat "glass" laminate that reflects a gradient sky environment +
// the sun (the glint), (3) a real aluminium FRAME + backsheet + optional rails.
// Tunable: cell type, backsheet, frame, 60/72-cell, glass gloss, array, tilt.
// Goal: nail the look here, then reuse on the roof forms (flat film, tilted rows…).
// ════════════════════════════════════════════════════════════════════
if (typeof THREE === 'undefined') { showErr('THREE failed to load — CDN blocked?'); throw new Error('no THREE'); }
function $(id){ return document.getElementById(id); }

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9cdf0);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 200);
camera.position.set(1.7, 1.35, 2.4);

const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, 0.25, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI/2 - 0.01; controls.minDistance = 0.8; controls.maxDistance = 16;

scene.add(new THREE.HemisphereLight(0xdcecff, 0x6a7a55, 0.55));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.0);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera; sc.left=-4;sc.right=4;sc.top=4;sc.bottom=-4;sc.near=0.5;sc.far=30; sun.shadow.bias=-0.0004;
scene.add(sun); scene.add(sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,60),
  new THREE.MeshStandardMaterial({color:0x6f9a48, roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// ── Sky environment (for glass reflections) ─────────────────────────
const pmrem = new THREE.PMREMGenerator(renderer); pmrem.compileEquirectangularShader();
function skyEquirect(){
  const cv=document.createElement('canvas'); cv.width=32; cv.height=256; const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0.00,'#5b8fd6'); g.addColorStop(0.42,'#a9c9ec'); g.addColorStop(0.52,'#e9eef2');
  g.addColorStop(0.54,'#cdd6d2'); g.addColorStop(1.00,'#5d7d40');
  x.fillStyle=g; x.fillRect(0,0,32,256);
  // a soft sun disc near the top for a believable glint
  const sx=22, sy=46; const rg=x.createRadialGradient(sx,sy,1,sx,sy,16);
  rg.addColorStop(0,'rgba(255,250,235,1)'); rg.addColorStop(1,'rgba(255,250,235,0)');
  x.fillStyle=rg; x.fillRect(sx-16,sy-16,32,32);
  const t=new THREE.CanvasTexture(cv); t.mapping=THREE.EquirectangularReflectionMapping; t.needsUpdate=true; return t;
}
scene.environment = pmrem.fromEquirectangular(skyEquirect()).texture;

// ── State ────────────────────────────────────────────────────────────
const ST = { cell:'mono', back:'black', frame:'silver', size:60, gloss:0.10, arr:'1', tilt:18, mount:true };

// ── Procedural cell-array texture ───────────────────────────────────
function cellTexture(cols, rows, cellType, back){
  const cw=120, W=cols*cw, H=rows*cw;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  x.fillStyle = back==='white' ? '#eef1f4' : '#0a0c10'; x.fillRect(0,0,W,H);  // backsheet (gap colour)
  const mono = cellType==='mono';
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const m=cw*0.05, px=c*cw+m, py=r*cw+m, w=cw-2*m, h=cw-2*m, ch=mono?w*0.14:0;
    x.save();
    x.beginPath();
    x.moveTo(px+ch,py); x.lineTo(px+w-ch,py); x.lineTo(px+w,py+ch); x.lineTo(px+w,py+h-ch);
    x.lineTo(px+w-ch,py+h); x.lineTo(px+ch,py+h); x.lineTo(px,py+h-ch); x.lineTo(px,py+ch); x.closePath();
    x.clip();
    const g=x.createLinearGradient(px,py,px+w,py+h);
    if(mono){ g.addColorStop(0,'#0a0f1c'); g.addColorStop(0.5,'#142848'); g.addColorStop(1,'#070a12'); }
    else    { g.addColorStop(0,'#143257'); g.addColorStop(0.5,'#1f5288'); g.addColorStop(1,'#102a4c'); }
    x.fillStyle=g; x.fillRect(px,py,w,h);
    if(!mono){ // polycrystalline speckle
      for(let i=0;i<120;i++){ x.fillStyle='rgba('+(20+Math.random()*50|0)+','+(70+Math.random()*90|0)+','+(130+Math.random()*100|0)+','+(0.05+Math.random()*0.12).toFixed(2)+')';
        const s=2+Math.random()*6; x.fillRect(px+Math.random()*w,py+Math.random()*h,s,s); }
    }
    // busbars (3 vertical silver lines)
    x.strokeStyle='rgba(205,210,222,0.5)'; x.lineWidth=Math.max(1.4,w*0.022);
    for(let b=1;b<=3;b++){ const bx=px+w*b/4; x.beginPath(); x.moveTo(bx,py); x.lineTo(bx,py+h); x.stroke(); }
    // fingers (fine horizontal grid)
    x.strokeStyle='rgba(185,195,210,0.10)'; x.lineWidth=1;
    for(let f=py+5; f<py+h; f+=5){ x.beginPath(); x.moveTo(px,f); x.lineTo(px+w,f); x.stroke(); }
    x.restore();
  }
  const t=new THREE.CanvasTexture(cv); t.anisotropy=8; t.needsUpdate=true; return t;
}

// ── One PV module (lies flat in XZ; +Y is up). Returns a Group. ──────
const CELL=0.156, GAP=0.003, MARGIN=0.014, FRAME_W=0.022, FRAME_H=0.036, LAM=0.006;
function makeModule(){
  const cols=6, rows = ST.size===72 ? 12 : 10;
  const innerW=cols*CELL+(cols-1)*GAP, innerL=rows*CELL+(rows-1)*GAP;
  const padW=innerW+2*MARGIN, padL=innerL+2*MARGIN;
  const totW=padW+2*FRAME_W, totL=padL+2*FRAME_W;
  const g=new THREE.Group();

  // laminate body (backsheet) — thin dark/white box
  const backCol = ST.back==='white' ? 0xe9edf1 : 0x0a0c10;
  const body=new THREE.Mesh(new THREE.BoxGeometry(padW,LAM,padL),
    new THREE.MeshStandardMaterial({color:backCol, roughness:0.7, metalness:0.0}));
  body.position.y=LAM/2; body.castShadow=true; body.receiveShadow=true; g.add(body);

  // glass + cells (clearcoat laminate face)
  const tex=cellTexture(cols,rows,ST.cell,ST.back);
  const face=new THREE.Mesh(new THREE.PlaneGeometry(innerW,innerL),
    new THREE.MeshPhysicalMaterial({ map:tex, roughness:0.32, metalness:0.0,
      clearcoat:1.0, clearcoatRoughness:ST.gloss, envMapIntensity:1.15, reflectivity:0.6 }));
  face.rotation.x=-Math.PI/2; face.position.y=LAM+0.002; face.receiveShadow=true; g.add(face);

  // aluminium frame (4 bars)
  const fm=new THREE.MeshStandardMaterial({color: ST.frame==='black'?0x18181b:0xbabdc4,
    metalness:0.85, roughness:ST.frame==='black'?0.42:0.3, envMapIntensity:1.0});
  const bar=(w,d,x,z)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,FRAME_H,d),fm); m.position.set(x,FRAME_H/2,z); m.castShadow=true; m.receiveShadow=true; g.add(m); };
  bar(totW, FRAME_W, 0, -(padL/2+FRAME_W/2));
  bar(totW, FRAME_W, 0,  (padL/2+FRAME_W/2));
  bar(FRAME_W, padL, -(padW/2+FRAME_W/2), 0);
  bar(FRAME_W, padL,  (padW/2+FRAME_W/2), 0);

  g.userData.size=[totW,totL];
  return g;
}

// ── Mounting rails under an array (standard roof rail look) ──────────
function addRails(group, totW, totL, spanX){
  const railMat=new THREE.MeshStandardMaterial({color:0x9a9ea4, metalness:0.8, roughness:0.35});
  for(const zz of [-totL*0.28, totL*0.28]){
    const rail=new THREE.Mesh(new THREE.BoxGeometry(spanX,0.03,0.045),railMat);
    rail.position.set(0,-0.03,zz); rail.castShadow=true; rail.receiveShadow=true; group.add(rail);
    for(let lx=-spanX/2+0.2; lx<=spanX/2; lx+=0.6){
      const leg=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.10,0.03),railMat);
      leg.position.set(lx,-0.085,zz); leg.castShadow=true; group.add(leg);
    }
  }
}

// ── Build the current selection (single / array), tilt + mount ──────
let rig=null;
function build(){
  if(rig){ scene.remove(rig); rig.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material&&o.material.map)o.material.map.dispose&&o.material.map.dispose(); }); }
  rig=new THREE.Group();
  const dims = ST.arr==='1' ? [1,1] : ST.arr==='2x2' ? [2,2] : [4,3]; // [cols(X), rows(Z)]
  const sample=makeModule(); const [mW,mL]=sample.userData.size; sample.traverse(o=>{if(o.geometry)o.geometry.dispose();});
  const gap=0.02, panels=new THREE.Group();
  const nX=dims[0], nZ=dims[1];
  for(let i=0;i<nX;i++) for(let j=0;j<nZ;j++){
    const mod=makeModule();
    mod.position.set((i-(nX-1)/2)*(mW+gap), 0, (j-(nZ-1)/2)*(mL+gap));
    panels.add(mod);
  }
  rig.add(panels);
  if(ST.mount) addRails(panels, mW, mL, nX*(mW+gap));
  // tilt about X, then lift so the low edge sits near the ground
  rig.rotation.x = -ST.tilt*Math.PI/180;
  const lift = Math.sin(ST.tilt*Math.PI/180)*(nZ*(mL+gap))/2 + 0.18;
  rig.position.y = lift;
  scene.add(rig);
  controls.target.set(0, lift*0.7+0.1, 0);
}
build();

// ── HUD wiring ───────────────────────────────────────────────────────
function group(id, key, cast){ document.querySelectorAll('#'+id+' button').forEach(b=>{ b.onclick=()=>{
  const v=b.dataset[Object.keys(b.dataset)[0]]; ST[key]=cast?cast(v):v;
  document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on', x===b)); build();
};}); }
group('cell','cell'); group('back','back'); group('frame','frame'); group('size','size', v=>+v); group('arr','arr');
// set initial actives
function act(id,attr,val){ document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on', b.dataset[attr]==String(val))); }
act('cell','cell',ST.cell); act('back','back',ST.back); act('frame','frame',ST.frame); act('size','size',ST.size); act('arr','arr',ST.arr);

$('sGl').oninput=function(){ ST.gloss=+this.value; $('vGl').textContent=(+this.value).toFixed(2); build(); };
$('sTl').oninput=function(){ ST.tilt=+this.value; $('vTl').textContent=this.value; build(); };
$('bMount').onclick=function(){ ST.mount=!ST.mount; this.classList.toggle('on',ST.mount); build(); };
$('bShadow').onclick=function(){ renderer.shadowMap.enabled=!renderer.shadowMap.enabled; scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;}); this.classList.toggle('on',renderer.shadowMap.enabled); };
function setSun(d){ const a=d*Math.PI/180; sun.position.set(Math.cos(a)*4+1.5, Math.sin(a)*6+1.5, Math.cos(a*0.6)*3+2.5); sun.target.position.set(0,0.3,0); }
$('sSun').oninput=function(){ $('vSun').textContent=this.value; setSun(+this.value); }; setSun(45);

// ── Render loop ──────────────────────────────────────────────────────
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
